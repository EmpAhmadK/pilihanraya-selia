<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Alat Suntingan Pilihan Raya{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="topbar">
  <a class="brand" href="{{ url_for('index') }}">Alat Wikidata Pilihan Raya</a>
  <div class="user-box">
    {% if username %}
      <span class="username">{{ username }}</span>
      <a class="btn btn-ghost" href="{{ url_for('logout') }}">Log keluar</a>
    {% else %}
      <a class="btn btn-primary" href="{{ url_for('login') }}">Log masuk dengan Wikimedia</a>
    {% endif %}
  </div>
</header>
<main class="container">
{% block content %}{% endblock %}
</main>
<script src="{{ url_for('static', filename='app.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
